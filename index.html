<!DOCTYPE html>
<html lang="pt-BR" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerenciador de Tarefas Moderno</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0fdf4',
                500: '#10b981',
                600: '#059669',
                700: '#047857',
              },
            },
          },
        },
      };
    </script>
    <!-- FontAwesome for Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Google Fonts Inter -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    class="bg-gradient-to-br from-indigo-50 via-sky-50 to-emerald-50 dark:from-gray-900 dark:via-slate-900 dark:to-gray-950 min-h-screen text-gray-800 dark:text-gray-100 flex flex-col justify-between transition-colors duration-300"
  >
    <main
      class="max-w-xl w-full mx-auto p-4 sm:p-6 my-8 flex-grow flex flex-col justify-start"
    >
      <!-- Header with Title & Theme Toggle -->
      <header
        class="flex justify-between items-center mb-6 bg-white/80 dark:bg-gray-800/80 backdrop-blur-md p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700"
      >
        <div>
          <h1
            class="text-2xl font-bold bg-gradient-to-r from-emerald-600 to-teal-500 bg-clip-text text-transparent flex items-center gap-2"
          >
            <i class="fa-solid fa-check-double"></i> Minhas Tarefas da AULA JS
          </h1>
          <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">
            Organize seu dia de forma simples e elegante
          </p>
        </div>
        <button
          id="theme-toggle"
          aria-label="Alternar Tema"
          class="w-10 h-10 rounded-xl bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 flex items-center justify-center text-gray-600 dark:text-yellow-400 transition-all shadow-sm"
        >
          <i class="fa-solid fa-moon dark:hidden text-lg"></i>
          <i class="fa-solid fa-sun hidden dark:block text-lg"></i>
        </button>
      </header>

      <!-- Task Input Section -->
      <section
        class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-md p-4 sm:p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 mb-6"
      >
        <form id="task-form" class="space-y-3">
          <div class="relative">
            <input
              type="text"
              id="task-input"
              placeholder="O que você precisa fazer hoje?"
              required
              class="w-full px-4 py-3.5 pl-11 bg-gray-50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 dark:focus:ring-emerald-400 focus:bg-white dark:focus:bg-gray-900 transition-all text-sm"
            />
            <span
              class="absolute left-3.5 top-3.5 text-gray-400 dark:text-gray-500 text-lg"
            >
              <i class="fa-solid fa-pen-nib"></i>
            </span>
          </div>

          <div class="flex flex-col sm:flex-row gap-3">
            <div class="flex-1 flex gap-2">
              <select
                id="task-category"
                class="px-3 py-2.5 bg-gray-50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all text-gray-600 dark:text-gray-300"
              >
                <option value="Trabalho">Trabalho</option>
                <option value="Pessoal" selected>Pessoal</option>
                <option value="Estudos">Estudos</option>
                <option value="Compras">Compras</option>
              </select>
              <select
                id="task-priority"
                class="px-3 py-2.5 bg-gray-50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all text-gray-600 dark:text-gray-300"
              >
                <option value="baixa">Baixa Prioridade</option>
                <option value="media" selected>Média Prioridade</option>
                <option value="alta">Alta Prioridade</option>
              </select>
            </div>
            <button
              type="submit"
              class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-medium px-5 py-2.5 rounded-xl text-sm shadow-md shadow-emerald-500/20 hover:shadow-lg transition-all flex items-center justify-center gap-2 active:scale-95"
            >
              <i class="fa-solid fa-plus"></i> Adicionar
            </button>
          </div>
        </form>
      </section>

      <!-- Filters & Status Header -->
      <section
        class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3 mb-4"
      >
        <!-- Filter Tabs -->
        <div
          class="flex bg-white/80 dark:bg-gray-800/80 backdrop-blur-md p-1 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700"
        >
          <button
            data-filter="all"
            class="filter-btn flex-1 sm:flex-none px-4 py-1.5 rounded-lg text-xs font-medium transition-all bg-emerald-500 text-white shadow-sm"
          >
            Todas
          </button>
          <button
            data-filter="pending"
            class="filter-btn flex-1 sm:flex-none px-4 py-1.5 rounded-lg text-xs font-medium transition-all text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white"
          >
            Pendentes
          </button>
          <button
            data-filter="completed"
            class="filter-btn flex-1 sm:flex-none px-4 py-1.5 rounded-lg text-xs font-medium transition-all text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white"
          >
            Concluídas
          </button>
        </div>

        <!-- Clear Completed Button -->
        <button
          id="clear-completed"
          class="text-xs text-rose-500 hover:text-rose-600 dark:hover:text-rose-400 font-medium py-2 px-3 rounded-xl transition-colors text-right sm:text-center"
        >
          <i class="fa-solid fa-trash-can mr-1"></i> Limpar Concluídas
        </button>
      </section>

      <!-- Task List Area -->
      <section
        class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-md rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden flex-grow flex flex-col"
      >
        <div
          id="tasks-container"
          class="divide-y divide-gray-100 dark:divide-gray-700/50 max-h-[380px] overflow-y-auto p-2"
        >
          <!-- Dynamic Tasks injected here -->
        </div>

        <!-- Empty State -->
        <div
          id="empty-state"
          class="hidden flex-col items-center justify-center p-10 text-center flex-grow"
        >
          <div
            class="w-16 h-16 bg-emerald-50 dark:bg-gray-700/50 text-emerald-500 rounded-full flex items-center justify-center text-2xl mb-3 shadow-inner"
          >
            <i class="fa-solid fa-clipboard-check"></i>
          </div>
          <h3 class="text-sm font-semibold text-gray-700 dark:text-gray-300">
            Nenhuma tarefa encontrada
          </h3>
          <p class="text-xs text-gray-400 dark:text-gray-500 mt-1">
            Adicione uma nova tarefa acima para começar seu dia produtivo!
          </p>
        </div>
      </section>

      <!-- Footer Counters -->
      <footer
        class="mt-4 flex justify-between items-center px-2 text-xs text-gray-500 dark:text-gray-400"
      >
        <div>
          <span
            id="items-left-count"
            class="font-bold text-gray-700 dark:text-gray-200"
            >0</span
          >
          itens pendentes
        </div>
        <div>
          Total:
          <span
            id="total-count"
            class="font-semibold text-gray-700 dark:text-gray-200"
            >0</span
          >
        </div>
      </footer>
    </main>

    <!-- Simple Notification / Message Modal (Custom alert alternative) -->
    <div
      id="message-modal"
      class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300"
    >
      <div
        class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-xl max-w-sm w-full mx-4 border border-gray-100 dark:border-gray-700 text-center transform scale-95 transition-transform duration-300"
        id="modal-content"
      >
        <div
          id="modal-icon"
          class="w-12 h-12 rounded-full mx-auto flex items-center justify-center text-xl mb-3"
        ></div>
        <h3
          id="modal-title"
          class="text-base font-bold text-gray-800 dark:text-gray-100 mb-1"
        >
          Atenção
        </h3>
        <p
          id="modal-message"
          class="text-xs text-gray-600 dark:text-gray-300 mb-5"
        ></p>
        <button
          id="modal-close-btn"
          class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-medium py-2 rounded-xl text-xs transition-colors shadow-md shadow-emerald-500/20"
        >
          Entendi
        </button>
      </div>
    </div>

    <!-- Script Logic -->
    <script src="script.js"></script>
  </body>
</html>
